name: archon-pr
description: |
  Disabled reference workflow in this fork: Git network writes require a
  human operator. The entry node fails before agent dispatch and prints
  manual commands. The retained upstream delivery nodes are not executed.

model: medium
requires: [github]

inputs:
  draft:
    default: "true"
    description: '"true" opens the PR as a draft; anything else opens it ready for review.'

returns: publish

nodes:
  # Fail before any agent can push or any forge script can publish a PR.
  - id: manual-network-only
    bash: |
      printf '%s\n' 'Git network writes are manual in this fork. Run these commands yourself after reviewing the branch and PR body:'
      printf '%s\n' 'git push -u origin <reviewed-branch>' 'gh pr create --repo <reviewed-owner/reviewed-repo> --draft --base <reviewed-base> --head <reviewed-branch> --body-file <reviewed-body>'
      exit 1

  # Retained upstream nodes stay unreachable behind the manual boundary.
  - id: pr
    depends_on: [manual-network-only]
    command: pr
    output_type: pull-request-intent
    output_format:
      type: object
      properties:
        intent: { type: string }
      required: [intent]

  # This is the durable ownership record for every later public action in
  # delivery and inbound forge event. Consumers use this qualified identity,
  # never gh's ambient branch lookup.
  - id: publish
    script: publish-pr
    runtime: bun
    timeout: 30000
    retry: { max_attempts: 2, delay_ms: 20000 }
    depends_on: [pr]
    with:
      intent: "$pr.output.intent"
    output_type: pull-request
    output_format:
      type: object
      properties:
        schemaVersion: { type: integer, enum: [1] }
        repo:
          type: object
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        number: { type: integer }
        url: { type: string }
        head: { type: string }
        base: { type: string }
        is_draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        head_repo:
          type: [object, 'null']
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        head_revision: { type: [string, 'null'] }
        base_revision: { type: [string, 'null'] }
        maintainer_can_modify: { type: [boolean, 'null'] }
      required:
        [
          schemaVersion,
          repo,
          number,
          url,
          head,
          base,
          is_draft,
          state,
          head_repo,
          head_revision,
          base_revision,
          maintainer_can_modify,
        ]
