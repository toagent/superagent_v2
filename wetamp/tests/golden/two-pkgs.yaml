      coder: $fix-m2-r3.output
      delta_base: $gate-m2-r2.output.reviewed_head
    output_format:
      type: object
      properties:
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: attempt-review-m2-r3
    always_run: true
    depends_on:
      - diff-m2-r3
    bash: printf '{"attempt":"%s"}' "$(cat '/GEN/attempts/review-m2-r3' 2>/dev/null || echo 0)"
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m2-r3
    when: $diff-m2-r3.output.disposition == 'advance' && $diff-m2-r3.output.same != 'true'
    command: sa-review-delta
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    effort: high
    idle_timeout: 900000
    with:
      milestone: m2
      risk: $diff-m2-r3.output.risk
      round: 3
      briefs: /GEN/briefs/core.md /GEN/briefs/api.md
      accept_log: $diff-m2-r3.output.log
      diff: $diff-m2-r3.output.delta
      full_diff: $diff-m2-r3.output.patch
      ledger: $gate-m2-r2.output.ledger_file
    depends_on:
      - diff-m2-r3
      - attempt-review-m2-r3
    mutates_checkout: false
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m2-r3
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m2-r3
      - review-m2-r3
    with:
      kind: gate
      round: 3
      R1:
        from: $review-m2-r1.output
        if_skipped: null
      C1: $diff-m2-r1.output
      R2:
        from: $review-m2-r2.output
        if_skipped: null
      C2: $diff-m2-r2.output
      R3:
        from: $review-m2-r3.output
        if_skipped: null
      C3: $diff-m2-r3.output
      risk: G2
      milestone: m2
      pkgs: api
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m2-r3
      archon: /GEN/archon
    trigger_rule: none_failed_min_one_success
  - id: human-m2
    wait:
      event: sa.human.m2
      deadline_ms: 2279404800000
    depends_on:
      - gate-m2-r1
      - gate-m2-r2
      - gate-m2-r3
    trigger_rule: none_failed_min_one_success
  - id: signoff-m2
    bash: |-
      s=$human-m2.output.status; [ "$s" = satisfied ] || { echo 'signoff m2: not approved' >&2; exit 1; }
      [ "$(date +%s)" -le 4070908800 ] || { echo 'signoff m2: plan deadline 2099-01-01T00:00:00Z passed' >&2; exit 1; }
    depends_on:
      - human-m2
  - id: land
    script: sa-check
    runtime: bun
    with:
      kind: land
      base_ref: main
      plan: /GEN/plan.json
    depends_on:
      - signoff-m2
