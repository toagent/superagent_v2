                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
