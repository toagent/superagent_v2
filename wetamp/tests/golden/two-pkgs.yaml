name: sa-golden-0001
description: 'superagent run golden-0001: 2 package(s), 2 milestone(s)'
nodes:
  - id: environment
    script: sa-check
    runtime: bun
    with:
      kind: env
      plan: /GEN/plan.json
  - id: start-m1
    bash: base=$(git merge-base 'main' HEAD) || exit $?; printf '{"head":"%s"}' "$base"
    depends_on:
      - environment
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: attempt-m1
    bash: printf '{"attempt":"%s"}' "$(cat '/GEN/attempts/m1' 2>/dev/null || echo 0)"
    depends_on:
      - start-m1
    always_run: true
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: code-core
    command: sa-code
    model: '@sa-coder'
    effort: high
    with:
      pkg: core
      brief: /GEN/briefs/core.md
      hint: /GEN/hints/core.md
    depends_on:
      - start-m1
      - attempt-m1
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: verify-core
    script: sa-check
    runtime: bun
    depends_on:
      - code-core
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      archon: /GEN/archon
      tag: verify-core
      coder: $code-core.output
    output_format:
      type: object
      properties:
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: repair-core
    command: sa-repair
    model: '@sa-coder'
    effort: medium
    with:
      pkg: core
      brief: /GEN/briefs/core.md
      hint: /GEN/hints/core.md
      reason: $verify-core.output.reason
      accept_log: $verify-core.output.log
    depends_on:
      - verify-core
      - attempt-m1
    when: $verify-core.output.disposition == 'repair'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: settle-core
    script: sa-check
    runtime: bun
    depends_on:
      - verify-core
      - repair-core
      - attempt-m1
    with:
      kind: settle
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      archon: /GEN/archon
      tag: settle-core
      first: $verify-core.output
      repaired:
        from: $repair-core.output
        if_skipped: null
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: diff-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - settle-core
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      tag: diff-m1-r1
      archon: /GEN/archon
    output_format:
      type: object
      properties:
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: attempt-review-m1-r1
    always_run: true
    depends_on:
      - diff-m1-r1
    bash: printf '{"attempt":"%s"}' "$(cat '/GEN/attempts/review-m1-r1' 2>/dev/null || echo 0)"
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m1-r1
    when: $diff-m1-r1.output.disposition == 'advance'
    command: sa-review
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    effort: high
    idle_timeout: 900000
    with:
      milestone: m1
      risk: $diff-m1-r1.output.risk
      round: 1
      briefs: /GEN/briefs/core.md
      accept_log: $diff-m1-r1.output.log
      diff: $diff-m1-r1.output.patch
    depends_on:
      - diff-m1-r1
      - attempt-review-m1-r1
    mutates_checkout: false
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r1
      - review-m1-r1
    with:
      kind: gate
      round: 1
      R1:
        from: $review-m1-r1.output
        if_skipped: null
      C1: $diff-m1-r1.output
      risk: G1
      milestone: m1
      pkgs: core
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m1-r1
      archon: /GEN/archon
      next: '1'
    trigger_rule: none_failed_min_one_success
  - id: fix-m1-r2
    command: sa-fix
    model: '@sa-coder'
    effort: medium
    with:
      milestone: m1
      round: 2
      ledger: $gate-m1-r1.output.ledger_file
      accept_log: $diff-m1-r1.output.log
      briefs: /GEN/briefs/core.md
      hints: /GEN/hints
    depends_on:
      - gate-m1-r1
      - attempt-m1
    when: $gate-m1-r1.output.verdict == 'fix'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
