            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: attempt-review-m1-r2
    always_run: true
    depends_on:
      - diff-m1-r2
    bash: printf '{"attempt":"%s"}' "$(cat '/GEN/attempts/review-m1-r2' 2>/dev/null || echo 0)"
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m1-r2
    when: $diff-m1-r2.output.disposition == 'advance' && $diff-m1-r2.output.same != 'true'
    command: sa-review-delta
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
