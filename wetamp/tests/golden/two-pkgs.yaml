          items:
            type: string
        error_class:
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
