name: sa-golden-0001
description: 'superagent run golden-0001: 2 package(s), 2 milestone(s)'
nodes:
  - id: environment
    script: sa-check
    runtime: bun
    with:
      kind: env
      plan: /GEN/plan.json
  - id: start-m1
    bash: 'printf ''{"head":"%s"}'' "$(git rev-parse HEAD)"'
    depends_on:
      - environment
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: code-core
    command: sa-code
    model: '@sa-coder'
    with:
      pkg: core
      brief: /GEN/briefs/core.md
      hint: /GEN/hints/core.md
    depends_on:
      - start-m1
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - null
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
  - id: verify-core
    script: sa-check
    runtime: bun
    depends_on:
      - code-core
    with:
      kind: accept
      plan: /GEN/plan.json
      pkgs: core
      base: $start-m1.output.head
      tag: verify-core
    output_format:
      type: object
      properties:
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
  - id: diff-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - verify-core
    with:
      kind: accept
      plan: /GEN/plan.json
      pkgs: core
      base: $start-m1.output.head
      tag: diff-m1-r1
    output_format:
      type: object
      properties:
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
  - id: review-m1-r1
    command: sa-review
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    idle_timeout: 900000
    with:
      milestone: m1
      risk: G1
      round: 1
      briefs: /GEN/briefs/core.md
      diff: $diff-m1-r1.output.patch
      accept_log: $diff-m1-r1.output.log
    depends_on:
      - diff-m1-r1
    mutates_checkout: false
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r1
      - review-m1-r1
    with:
      kind: gate
      round: 1
      R1: $review-m1-r1.output
      C1: $diff-m1-r1.output
      risk: G1
      milestone: m1
      plan: /GEN/plan.json
      tag: gate-m1-r1
  - id: fix-m1-r2
    command: sa-fix
    model: '@sa-coder'
    with:
      milestone: m1
      round: 2
      review: $gate-m1-r1.output.review_file
      accept_log: $diff-m1-r1.output.log
      briefs: /GEN/briefs/core.md
      hints: /GEN/hints
    depends_on:
      - gate-m1-r1
    when: "$gate-m1-r1.output.verdict == 'fix'"
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
