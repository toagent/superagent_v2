name: sa-golden-0001
description: 'superagent run golden-0001: 2 package(s), 2 milestone(s)'
nodes:
  - id: environment
    script: sa-check
    runtime: bun
    with:
      kind: env
      plan: /GEN/plan.json
    retry:
      max_attempts: 5
      on_error: all
  - id: start-m1
    bash: base=$(git merge-base 'main' HEAD) || exit $?; printf '{"head":"%s"}' "$base"
    depends_on:
      - environment
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: attempt-m1
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/m1
      gen: /GEN
      pkg: ''
      review: ''
    depends_on:
      - start-m1
    always_run: true
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: package-attempt-core
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/.packages/core
      gen: /GEN
      pkg: core
      review: ''
    depends_on:
      - start-m1
    always_run: true
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: code-core
    command: sa-code
    retry:
      max_attempts: 1
      on_error: transient
    model: '@sa-coder'
    effort: medium
    with:
      pkg: core
      brief: /GEN/briefs/core.md
      hint: /GEN/hints/core.md
    depends_on:
      - start-m1
      - package-attempt-core
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: verify-core
    script: sa-check
    runtime: bun
    depends_on:
      - code-core
      - package-attempt-core
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      archon: /GEN/archon
      tag: verify-core
      coder: $code-core.output
    output_format:
      type: object
      properties:
        decision: &delivery-decision
          type: object
          properties:
            kind:
              enum:
                - advance
                - debt
                - repair
                - block
            reason:
              type:
                - string
                - 'null'
            evidence:
              type: array
              items:
                type: string
            debt:
              type: array
              items:
                type: string
            requirements:
              {
                'type': 'object',
                'required': ['status', 'items'],
                'properties':
                  {
                    'status': { 'enum': ['legacy', 'verified', 'unmet', 'unknown'] },
                    'items':
                      {
                        'type': 'array',
                        'items':
                          {
                            'type': 'object',
                            'required': ['package', 'id', 'text', 'status', 'evidence'],
                            'properties':
                              {
                                'package': { 'type': 'string' },
                                'id': { 'type': 'string' },
                                'text': { 'type': 'string' },
                                'status': { 'enum': ['verified', 'unmet', 'unknown'] },
                                'evidence': { 'type': 'array', 'items': { 'type': 'string' } },
                              },
                          },
                      },
                  },
              }
          required:
            - kind
            - reason
            - evidence
            - debt
        workspace_clean:
          type: boolean
        failures:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              evidence:
                type: string
            required:
              - command
              - failure_class
              - evidence
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
        - decision
    timeout: 155000
  - id: repair-core
    command: sa-repair
    retry:
      max_attempts: 1
      on_error: transient
    model: '@sa-coder'
    effort: medium
    with:
      pkg: core
      brief: /GEN/briefs/core.md
      hint: /GEN/hints/core.md
      reason: $verify-core.output.reason
      accept_log: $verify-core.output.log
    depends_on:
      - verify-core
      - package-attempt-core
    when: $verify-core.output.disposition == 'repair'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: settle-core
    script: sa-check
    runtime: bun
    depends_on:
      - verify-core
      - repair-core
      - package-attempt-core
    with:
      kind: settle
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      archon: /GEN/archon
      tag: settle-core
      first: $verify-core.output
      repaired:
        from: $repair-core.output
        if_skipped: null
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        diff_hash:
          type: string
      required:
        - diff_hash
    timeout: 155000
  - id: diff-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - settle-core
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      tag: diff-m1-r1
      archon: /GEN/archon
    output_format:
      type: object
      properties:
        decision: *delivery-decision
        workspace_clean:
          type: boolean
        failures:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              evidence:
                type: string
            required:
              - command
              - failure_class
              - evidence
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
        - decision
    timeout: 155000
  - id: attempt-review-m1-r1
    always_run: true
    when: "$diff-m1-r1.output.disposition == 'advance'"
    depends_on:
      - diff-m1-r1
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/review-m1-r1
      gen: /GEN
      pkg: ''
      review: review-m1-r1
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m1-r1
    when: $diff-m1-r1.output.disposition == 'advance'
    command: sa-review
    retry:
      max_attempts: 2
      on_error: transient
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    effort: high
    idle_timeout: 900000
    with:
      context: $ARTIFACTS_DIR/review-m1-r1.context.json
      milestone: m1
      risk: $diff-m1-r1.output.risk
      round: 1
      briefs: /GEN/briefs/core.md
      accept_log: $diff-m1-r1.output.log
      diff: $diff-m1-r1.output.patch
    depends_on:
      - diff-m1-r1
      - attempt-review-m1-r1
    mutates_checkout: false
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              command:
                type:
                  - string
                  - 'null'
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
              - failure_class
              - command
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r1
      - review-m1-r1
    with:
      kind: gate
      scope_pkgs: core
      review: '1'
      round: 1
      R1:
        from: $review-m1-r1.output
        if_skipped: null
      C1: $diff-m1-r1.output
      risk: G1
      milestone: m1
      pkgs: core
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m1-r1
      archon: /GEN/archon
      next: '1'
    trigger_rule: none_failed_min_one_success
  - id: fix-m1-r2
    command: sa-fix
    retry:
      max_attempts: 1
      on_error: transient
    model: '@sa-coder'
    effort: medium
    with:
      milestone: m1
      round: 2
      ledger: $gate-m1-r1.output.ledger_file
      accept_log: $diff-m1-r1.output.log
      briefs: /GEN/briefs/core.md
      hints: /GEN/hints
    depends_on:
      - gate-m1-r1
      - attempt-m1
    when: $gate-m1-r1.output.verdict == 'fix'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: diff-m1-r2
    script: sa-check
    runtime: bun
    depends_on:
      - fix-m1-r2
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $start-m1.output.head
      risk: G1
      milestone: m1
      tag: diff-m1-r2
      archon: /GEN/archon
      prev: $diff-m1-r1.output.diff_hash
      coder: $fix-m1-r2.output
      delta_base: $gate-m1-r1.output.reviewed_head
    output_format:
      type: object
      properties:
        decision: *delivery-decision
        workspace_clean:
          type: boolean
        failures:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              evidence:
                type: string
            required:
              - command
              - failure_class
              - evidence
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
        - decision
    timeout: 155000
  - id: attempt-review-m1-r2
    always_run: true
    when: "$diff-m1-r2.output.disposition == 'advance' && $diff-m1-r2.output.same != 'true'"
    depends_on:
      - diff-m1-r2
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/review-m1-r2
      gen: /GEN
      pkg: ''
      review: review-m1-r2
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m1-r2
    when: $diff-m1-r2.output.disposition == 'advance' && $diff-m1-r2.output.same != 'true'
    command: sa-review-delta
    retry:
      max_attempts: 2
      on_error: transient
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    effort: medium
    idle_timeout: 900000
    with:
      context: $ARTIFACTS_DIR/review-m1-r2.context.json
      milestone: m1
      risk: $diff-m1-r2.output.risk
      round: 2
      briefs: /GEN/briefs/core.md
      accept_log: $diff-m1-r2.output.log
      diff: $diff-m1-r2.output.delta
      full_diff: $diff-m1-r2.output.patch
      ledger: $gate-m1-r1.output.ledger_file
    depends_on:
      - diff-m1-r2
      - attempt-review-m1-r2
    mutates_checkout: false
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              command:
                type:
                  - string
                  - 'null'
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
              - failure_class
              - command
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r2
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r2
      - review-m1-r2
    with:
      kind: gate
      scope_pkgs: core
      review: '1'
      round: 2
      R1:
        from: $review-m1-r1.output
        if_skipped: null
      C1: $diff-m1-r1.output
      R2:
        from: $review-m1-r2.output
        if_skipped: null
      C2: $diff-m1-r2.output
      risk: G1
      milestone: m1
      pkgs: core
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m1-r2
      archon: /GEN/archon
      next: '1'
    trigger_rule: none_failed_min_one_success
  - id: fix-m1-r3
    command: sa-fix
    retry:
      max_attempts: 1
      on_error: transient
    model: '@sa-coder'
    effort: medium
    with:
      milestone: m1
      round: 3
      ledger: $gate-m1-r2.output.ledger_file
      accept_log: $diff-m1-r2.output.log
      briefs: /GEN/briefs/core.md
      hints: /GEN/hints
    depends_on:
      - gate-m1-r2
      - attempt-m1
    when: $gate-m1-r2.output.verdict == 'fix'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
