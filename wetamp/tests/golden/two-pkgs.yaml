          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - suspend
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - base_pass
        - head
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
  - id: attempt-review-m1-r3
    always_run: true
    depends_on:
      - diff-m1-r3
    bash: printf '{"attempt":"%s"}' "$(cat '/GEN/attempts/review-m1-r3' 2>/dev/null || echo 0)"
    output_format:
