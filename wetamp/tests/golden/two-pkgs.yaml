        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r2
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r2
      - review-m1-r2
    with:
      kind: gate
      round: 2
      R1:
        from: $review-m1-r1.output
        if_skipped: null
      C1: $diff-m1-r1.output
      R2:
        from: $review-m1-r2.output
        if_skipped: null
      C2: $diff-m1-r2.output
      risk: G1
      milestone: m1
      pkgs: core
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m1-r2
      archon: /GEN/archon
