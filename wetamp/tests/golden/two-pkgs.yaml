  - id: review-m1-r3
    when: $diff-m1-r3.output.disposition == 'advance' && $diff-m1-r3.output.same != 'true'
    command: sa-review-delta
    model: '@sa-reviewer'
    mcp: /GEN/reviewer-readonly.mcp.json
    effort: medium
    idle_timeout: 900000
    with:
      milestone: m1
      risk: $diff-m1-r3.output.risk
