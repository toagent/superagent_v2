name: sa-golden-0001
description: 'superagent run golden-0001: 2 package(s), 2 milestone(s)'
nodes:
  - id: environment
    script: sa-check
    runtime: bun
    with:
      kind: env
      plan: /GEN/plan.json
    timeout: 360000
    retry:
      max_attempts: 5
      on_error: all
  - id: sync-m1
    bash: |-
      tip=$(git rev-parse --verify 'main^{commit}') || exit $?
      base=$(git merge-base HEAD "$tip") || exit $?
      printf '{"status":"noop","target_tip":"%s","merge_base":"%s","head":"%s","generation":1}' "$tip" "$base" "$(git rev-parse HEAD)"
    depends_on:
      - environment
    output_format:
      type: object
      properties:
        status:
          enum:
            - noop
            - merged
            - conflict
            - resolved
        target_tip:
          type: string
        merge_base:
          type: string
        head:
          type: string
        generation:
          type: integer
        files:
          type: array
          items:
            type: string
      required:
        - status
        - target_tip
        - generation
  - id: sync-m1-ready
    depends_on:
      - sync-m1
    trigger_rule: none_failed_min_one_success
    bash: |-
      tip=$sync-m1.output.target_tip
      status=$sync-m1.output.status
      generation=$sync-m1.output.generation
      if [ "$status" = conflict ]; then git merge-base --is-ancestor "$tip" HEAD || { echo 'sync_conflict: target tip is not integrated' >&2; exit 1; }; status=resolved; fi
      base=$(git merge-base HEAD "$tip") || exit $?
      printf '{"status":"%s","target_tip":"%s","merge_base":"%s","head":"%s","generation":%s}' "$status" "$tip" "$base" "$(git rev-parse HEAD)" "$generation"
    output_format:
      type: object
      properties:
        status:
          enum:
            - noop
            - merged
            - conflict
            - resolved
        target_tip:
          type: string
        merge_base:
          type: string
        head:
          type: string
        generation:
          type: integer
        files:
          type: array
          items:
            type: string
      required:
        - status
        - target_tip
        - generation
  - id: attempt-m1
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/m1
      gen: /GEN
      pkg: ''
      review: ''
    depends_on:
      - sync-m1-ready
    always_run: true
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: package-attempt-core
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/.packages/core
      gen: /GEN
      pkg: core
      review: ''
    depends_on:
      - sync-m1-ready
    always_run: true
    output_format:
      type: object
      properties:
        attempt:
          type: string
        context_pack_path:
          type: string
      required:
        - attempt
  - id: code-core
    bash: |-
      mkdir -p "$(dirname 'core.txt')" && echo 'core' >> 'core.txt'
      git add 'core.txt' && git -c user.name=sa -c user.email=sa@localhost commit -qm 'fake core'
      echo '{"status":"done","changed_files":["core.txt"],"quick_checks":[],"notes":"fake","blockers":[],"error_class":null,"deviations":[],"needs":[]}'
    with:
      soldier_ok: ''
    depends_on:
      - sync-m1-ready
      - package-attempt-core
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: verify-core
    script: sa-check
    runtime: bun
    depends_on:
      - code-core
      - package-attempt-core
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $sync-m1-ready.output.merge_base
      delta_base: $sync-m1-ready.output.head
      target_tip: $sync-m1-ready.output.target_tip
      sync_generation: $sync-m1-ready.output.generation
      risk: G1
      milestone: m1
      tag: verify-core
      coder: $code-core.output
    output_format:
      type: object
      properties:
        decision:
          type: object
          properties:
            kind:
              enum:
                - advance
                - debt
                - repair
                - block
            reason:
              type:
                - string
                - 'null'
            evidence:
              type: array
              items:
                type: string
            debt:
              type: array
              items:
                type: string
            requirements:
              type: object
              required:
                - status
                - items
              properties:
                status:
                  enum:
                    - legacy
                    - verified
                    - unmet
                    - unknown
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - package
                      - id
                      - text
                      - status
                      - evidence
                    properties:
                      package:
                        type: string
                      id:
                        type: string
                      text:
                        type: string
                      status:
                        enum:
                          - verified
                          - unmet
                          - unknown
                      evidence:
                        type: array
                        items:
                          type: string
          required:
            - kind
            - reason
            - evidence
            - debt
        workspace_clean:
          type: boolean
        failures:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              evidence:
                type: string
              failed_tests:
                type: array
                items:
                  type: string
              failure_digest:
                type: string
              adjudicated:
                type: boolean
            required:
              - command
              - failure_class
              - evidence
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        reviewed:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        checkout_fingerprint:
          type: string
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - adjudicate
            - fail
            - suspend
        adjudication:
          type: object
          required:
            - diff_hash
            - contract_hash
            - command
            - failed_tests
            - failure_digest
            - report
            - counts
            - known
            - cases
          properties:
            diff_hash:
              type: string
            contract_hash:
              type: string
            command:
              type: string
            failed_tests:
              type: array
              items:
                type: string
            failure_digest:
              type: string
            report:
              type: string
            counts:
              type: object
            known:
              type: array
            cases:
              type: array
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - reviewed
        - base_pass
        - head
        - checkout_fingerprint
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
        - decision
    timeout: 195000
  - id: repair-core
    bash: |-
      mkdir -p "$(dirname 'core.txt')" && echo 'repair core' >> 'core.txt'
      git add 'core.txt' && git -c user.name=sa -c user.email=sa@localhost commit -qm 'fake repair core'
      echo '{"status":"done","changed_files":["core.txt"],"quick_checks":[],"notes":"fake","blockers":[],"error_class":null,"deviations":[],"needs":[]}'
    depends_on:
      - verify-core
      - package-attempt-core
    when: $verify-core.output.disposition == 'repair'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: settle-core
    script: sa-check
    runtime: bun
    depends_on:
      - verify-core
      - repair-core
      - package-attempt-core
    with:
      kind: settle
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $sync-m1-ready.output.merge_base
      delta_base: $sync-m1-ready.output.head
      target_tip: $sync-m1-ready.output.target_tip
      sync_generation: $sync-m1-ready.output.generation
      risk: G1
      milestone: m1
      tag: settle-core
      first: $verify-core.output.disposition
      repaired:
        from: $repair-core.output
        if_skipped: null
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        diff_hash:
          type: string
        head:
          type: string
      required:
        - diff_hash
    timeout: 195000
  - id: sync-review-m1
    bash: |-
      tip=$(git rev-parse --verify 'main^{commit}') || exit $?
      base=$(git merge-base HEAD "$tip") || exit $?
      printf '{"status":"noop","target_tip":"%s","merge_base":"%s","head":"%s","generation":1}' "$tip" "$base" "$(git rev-parse HEAD)"
    depends_on:
      - settle-core
    output_format:
      type: object
      properties:
        status:
          enum:
            - noop
            - merged
            - conflict
            - resolved
        target_tip:
          type: string
        merge_base:
          type: string
        head:
          type: string
        generation:
          type: integer
        files:
          type: array
          items:
            type: string
      required:
        - status
        - target_tip
        - generation
  - id: sync-review-m1-ready
    depends_on:
      - sync-review-m1
    trigger_rule: none_failed_min_one_success
    bash: |-
      tip=$sync-review-m1.output.target_tip
      status=$sync-review-m1.output.status
      generation=$sync-review-m1.output.generation
      if [ "$status" = conflict ]; then git merge-base --is-ancestor "$tip" HEAD || { echo 'sync_conflict: target tip is not integrated' >&2; exit 1; }; status=resolved; fi
      base=$(git merge-base HEAD "$tip") || exit $?
      printf '{"status":"%s","target_tip":"%s","merge_base":"%s","head":"%s","generation":%s}' "$status" "$tip" "$base" "$(git rev-parse HEAD)" "$generation"
    output_format:
      type: object
      properties:
        status:
          enum:
            - noop
            - merged
            - conflict
            - resolved
        target_tip:
          type: string
        merge_base:
          type: string
        head:
          type: string
        generation:
          type: integer
        files:
          type: array
          items:
            type: string
      required:
        - status
        - target_tip
        - generation
  - id: diff-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - sync-review-m1-ready
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $sync-review-m1-ready.output.merge_base
      target_tip: $sync-m1-ready.output.target_tip
      sync_generation: $sync-m1-ready.output.generation
      risk: G1
      milestone: m1
      tag: diff-m1-r1
      acceptance_evidence: $ARTIFACTS_DIR/sync-review-m1-ready.json
    output_format:
      type: object
      properties:
        decision:
          type: object
          properties:
            kind:
              enum:
                - advance
                - debt
                - repair
                - block
            reason:
              type:
                - string
                - 'null'
            evidence:
              type: array
              items:
                type: string
            debt:
              type: array
              items:
                type: string
            requirements:
              type: object
              required:
                - status
                - items
              properties:
                status:
                  enum:
                    - legacy
                    - verified
                    - unmet
                    - unknown
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - package
                      - id
                      - text
                      - status
                      - evidence
                    properties:
                      package:
                        type: string
                      id:
                        type: string
                      text:
                        type: string
                      status:
                        enum:
                          - verified
                          - unmet
                          - unknown
                      evidence:
                        type: array
                        items:
                          type: string
          required:
            - kind
            - reason
            - evidence
            - debt
        workspace_clean:
          type: boolean
        failures:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              evidence:
                type: string
              failed_tests:
                type: array
                items:
                  type: string
              failure_digest:
                type: string
              adjudicated:
                type: boolean
            required:
              - command
              - failure_class
              - evidence
        coder_partial:
          type: boolean
        self_report_conflict:
          type: boolean
        error_class_ignored:
          type: boolean
        ok:
          type: boolean
        failed:
          type: array
          items:
            type: string
        log:
          type: string
        patch:
          type: string
        diff_hash:
          type: string
        same:
          type: boolean
        reviewed:
          type: boolean
        base_pass:
          type:
            - boolean
            - 'null'
        checkout_fingerprint:
          type: string
        head:
          type: string
        disposition:
          enum:
            - advance
            - repair
            - adjudicate
            - fail
            - suspend
        adjudication:
          type: object
          required:
            - diff_hash
            - contract_hash
            - command
            - failed_tests
            - failure_digest
            - report
            - counts
            - known
            - cases
          properties:
            diff_hash:
              type: string
            contract_hash:
              type: string
            command:
              type: string
            failed_tests:
              type: array
              items:
                type: string
            failure_digest:
              type: string
            report:
              type: string
            counts:
              type: object
            known:
              type: array
            cases:
              type: array
        reason:
          type:
            - string
            - 'null'
        delta:
          type: string
        risk:
          type:
            - string
            - 'null'
        out_of_scope:
          type: array
          items:
            type: string
      required:
        - ok
        - failed
        - log
        - patch
        - diff_hash
        - same
        - reviewed
        - base_pass
        - head
        - checkout_fingerprint
        - disposition
        - reason
        - delta
        - risk
        - out_of_scope
        - decision
    timeout: 195000
  - id: attempt-review-m1-r1
    when: $diff-m1-r1.output.disposition == 'advance'
    depends_on:
      - diff-m1-r1
      - attempt-m1
    script: sa-context
    runtime: bun
    with:
      counter: /GEN/attempts/review-m1-r1
      gen: /GEN
      pkg: ''
      review: ''
    output_format:
      type: object
      properties:
        attempt:
          type: string
      required:
        - attempt
  - id: review-m1-r1
    when: $diff-m1-r1.output.disposition == 'advance'
    bash: echo '{"status":"FAIL","notes":"fake","findings":[{"id":"R1-1","severity":"high","file":"fake","line":1,"failure_class":"product","command":null,"status":"open","evidence":"fake","carry_over":false}],"fixture_confirmations":[],"debt":[]}'
    depends_on:
      - diff-m1-r1
      - attempt-review-m1-r1
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - PASS
            - FAIL
            - INCOMPLETE
        notes:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                  - blocker
                  - high
                  - medium
                  - low
              file:
                type: string
              line:
                type: integer
              status:
                type: string
                enum:
                  - open
                  - closed
              evidence:
                type: string
              failure_class:
                type: string
                enum:
                  - product
                  - test_env
                  - fixture
                  - baseline
                  - test_data
                  - unknown
              command:
                type:
                  - string
                  - 'null'
              carry_over:
                type: boolean
            required:
              - id
              - severity
              - file
              - line
              - status
              - evidence
              - carry_over
              - failure_class
              - command
        fixture_confirmations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              purpose:
                type: string
              isolated_fixture:
                type: boolean
              no_data_operations:
                type: boolean
              evidence:
                type: string
            required:
              - path
              - purpose
              - isolated_fixture
              - no_data_operations
              - evidence
        debt:
          type: array
          items:
            type: string
      required:
        - status
        - notes
        - findings
        - fixture_confirmations
        - debt
  - id: gate-m1-r1
    script: sa-check
    runtime: bun
    depends_on:
      - diff-m1-r1
      - review-m1-r1
    with:
      kind: gate
      review: '1'
      round: 1
      R1:
        from: $review-m1-r1.output
        if_skipped: null
      C1: $ARTIFACTS_DIR/diff-m1-r1.json
      C1_HEAD: $diff-m1-r1.output.head
      C1_DIFF_HASH: $diff-m1-r1.output.diff_hash
      risk: G1
      milestone: m1
      pkgs: core
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      tag: gate-m1-r1
      next: '1'
    trigger_rule: none_failed_min_one_success
  - id: fix-m1-r2
    bash: |-
      mkdir -p "$(dirname 'core.txt')" && echo 'fix m1 r2' >> 'core.txt'
      git add 'core.txt' && git -c user.name=sa -c user.email=sa@localhost commit -qm 'fake fix m1 r2'
      echo '{"status":"done","changed_files":["core.txt"],"quick_checks":[],"notes":"fake","blockers":[],"error_class":null,"deviations":[],"needs":[]}'
    depends_on:
      - gate-m1-r1
      - attempt-m1
    when: $gate-m1-r1.output.verdict == 'fix'
    output_format:
      type: object
      properties:
        status:
          type: string
          enum:
            - done
            - blocked
            - partial
        changed_files:
          type: array
          items:
            type: string
        quick_checks:
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
              exit:
                type: integer
            required:
              - cmd
              - exit
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string
        error_class:
          description: 仅在未完成（partial/blocked/error）时填写失败类别；status=done 时必须为 null
          type:
            - string
            - 'null'
          enum:
            - scope_violation
            - budget_exhausted
            - plan_invalid
            - sandbox_denied
            - permission_denied
            - vendor_unavailable_all
            - task
            - env
            - timeout
            - redline
            - null
        deviations:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              why:
                type: string
            required:
              - path
              - why
        needs:
          type: array
          items:
            type: object
            properties:
              cap:
                type: string
              why:
                type: string
              minimal_ask:
                type: string
            required:
              - cap
              - why
              - minimal_ask
      required:
        - status
        - changed_files
        - quick_checks
        - notes
        - blockers
        - error_class
        - deviations
        - needs
  - id: diff-m1-r2
    script: sa-check
    runtime: bun
    depends_on:
      - fix-m1-r2
      - attempt-m1
    with:
      kind: accept
      plan: /GEN/plan.json
      policy: /GEN/policy.json
      pkgs: core
      scope_pkgs: core
      base: $sync-review-m1-ready.output.merge_base
      target_tip: $sync-m1-ready.output.target_tip
      sync_generation: $sync-m1-ready.output.generation
      risk: G1
      milestone: m1
      tag: diff-m1-r2
      acceptance_evidence: $ARTIFACTS_DIR/diff-m1-r1.json
      prev: $diff-m1-r1.output.diff_hash
      coder: $fix-m1-r2.output
      delta_base: $gate-m1-r1.output.reviewed_head
      reviewed_diff_hash: $gate-m1-r1.output.reviewed_diff_hash
    output_format:
      type: object
      properties:
        decision:
          type: object
          properties:
