name: memory-reflect
description: Distill bounded episode metadata into reusable memory operations.
model: '@sa-coder'

nodes:
  - id: reflect
    idle_timeout: 120000
    retry:
      max_attempts: 5
      delay_ms: 1000
      on_error: all
    prompt: $ARGUMENTS
    output_format:
      type: object
      additionalProperties: false
      properties:
        operations:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            properties:
              op: { type: string, enum: [ADD, EDIT, UPVOTE] }
              id: { type: [string, 'null'], maxLength: 240 }
              lesson:
                type: [object, 'null']
                additionalProperties: false
                properties:
                  tier: { type: string, enum: [project, type, role] }
                  scope: { type: string, minLength: 1, maxLength: 240 }
                  when: { type: string, minLength: 1, maxLength: 240 }
                  do: { type: string, minLength: 1, maxLength: 240 }
                  dont: { type: string, maxLength: 240 }
                  why: { type: string, maxLength: 240 }
                  evidence:
                    {
                      type: array,
                      minItems: 1,
                      maxItems: 5,
                      items: { type: string, maxLength: 240 },
                    }
                  mechanizable: { type: boolean }
                required: [tier, scope, when, do, dont, why, evidence, mechanizable]
            required: [op, id, lesson]
        reason:
          type: [string, 'null']
          maxLength: 240
      required: [operations, reason]
