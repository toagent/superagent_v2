[extend]
useDefault = true

[[rules]]
id = "password-assignment"
description = "Password field assignment"
regex = '''(?i)\b(?:password|passwd|pwd)\b["']?\s*[:=]\s*["']?([^\s"',;}]{8,})'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  '''(?i)\b(?:password|passwd|pwd)\b["']?\s*[:=]\s*["']?(?:[0-9]{8,}|true|false|null|none|undefined|changeme|password|placeholder|example|sample|<[^>]+>|\*{8,})["']?$''',
  '''(?i)\b(?:password|passwd|pwd)\b["']?\s*[:=]\s*["']?(?:\$\{?[A-Za-z_][A-Za-z0-9_.]*\}?|(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+[A-Za-z_$][A-Za-z0-9_$]*(?:\([^)]*\))?|[A-Za-z_$][A-Za-z0-9_$]*\([^)]*\))''',
]

[[rules]]
id = "credentialed-connection-string"
description = "Connection string with embedded credentials"
regex = '''(?i)\b(?:postgres|mysql|mongodb|redis|amqp)://[^\s:/@]+:([^\s/@]+)@'''
secretGroup = 1

[[rules]]
id = "webhook-signing-secret"
description = "Webhook signing secret"
regex = '''\b(whsec_[A-Za-z0-9_-]{8,})\b'''
secretGroup = 1

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{8,})\b'''
secretGroup = 1

# Synthetic test fixture committed literally in sf2-redact (later regenerated at run time).
# Commit-scoped only: affects git-history scans (land gate), never content scanning.
[[allowlists]]
description = "sf2-redact synthetic gitleaks rule fixtures"
commits = ["7f965685b379eff75dbcd99d14d1f05ecaf2094d"]
