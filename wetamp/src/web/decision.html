<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>操作者审批收件箱</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <style>
      :root {
        --paper: #f3f5f7;
        --surface: #fff;
        --ink: #19252f;
        --muted: #536574;
        --line: #d5dde4;
        --action: #1756a5;
        --error: #9e3029;
      }
      * {
        box-sizing: border-box;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: auto;
        padding: 32px 20px max(32px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 28px;
        line-height: 1.3;
        margin: 8px 0 16px;
        text-wrap: balance;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        margin: 8px 0 16px;
      }
      .eyebrow,
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin: 24px 0;
      }
      #inbox button {
        min-height: 44px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      #inbox button[aria-current='true'] {
        border-color: var(--action);
        box-shadow: inset 3px 0 var(--action);
      }
      #inbox button span {
        color: var(--muted);
        font-size: 14px;
      }
      button,
      input {
        font: inherit;
        min-height: 48px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 12px;
        width: 100%;
      }
      button {
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        text-align: left;
        margin-top: 12px;
      }
      button strong,
      button span {
        display: block;
      }
      button span {
        font-size: 16px;
        font-weight: 400;
      }
      .primary {
        background: var(--action);
        color: white;
        border-color: var(--action);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:hover:not(:disabled) {
        filter: brightness(0.95);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      :focus-visible {
        outline: 3px solid var(--action);
        outline-offset: 3px;
      }
      #connection {
        border-left: 3px solid var(--line);
        padding-left: 12px;
        overflow-wrap: anywhere;
      }
      .error {
        color: var(--error);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
      }
      ol {
        padding-left: 24px;
      }
      li {
        margin: 8px 0;
      }
      time {
        font-variant-numeric: tabular-nums;
      }
      .receipt-summary {
        margin: 0;
      }
      .receipt-summary div {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .receipt-summary div:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .receipt-summary dt {
        color: var(--muted);
        font-size: 14px;
      }
      .receipt-summary dd {
        margin: 2px 0 0;
        font-weight: 600;
      }
      details {
        margin-top: 24px;
        color: var(--muted);
      }
      dialog {
        max-width: min(480px, calc(100% - 40px));
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgb(25 37 47 / 45%);
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script src="/decision.js" defer></script>
  </head>
  <body>
    <main>
      <div class="eyebrow">需要你 / 受管审批</div>
      <h1>操作者审批收件箱</h1>
      <p class="muted">
        仅包含 Archon 管理且有原生审批 occurrence 的事项；独立代理和 Orca/cmux 原生弹窗不在此处。
      </p>
      <p id="connection" role="status" aria-live="polite">正在连接…</p>
      <section id="setup">
        <h2>授权本设备</h2>
        <p>先添加到主屏幕。生产授权需要重新配对，旧实验授权无效。</p>
        <label for="code">Mac 私有配对页中的一次性码</label
        ><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="pair">配对</button>
      </section>
      <section id="inbox-wrap" hidden>
        <h2>待处理</h2>
        <div id="inbox"></div>
      </section>
      <section id="item" hidden>
        <h2 id="question"></h2>
        <p id="reason"></p>
        <p id="context"></p>
        <p id="disabled"></p>
        <div id="options"></div>
      </section>
      <section>
        <h2>执行回执</h2>
        <dl class="receipt-summary">
          <div>
            <dt>手机操作</dt>
            <dd id="receipt">尚未提交选择</dd>
          </div>
          <div>
            <dt>引擎状态</dt>
            <dd id="state">正在读取…</dd>
          </div>
        </dl>
      </section>
      <section>
        <button id="notify">开启通知</button>
        <p id="push"></p>
        <button id="refresh">刷新页面</button>
        <details>
          <summary>设备设置</summary>
          <button id="revoke">撤销本设备授权</button>
        </details>
      </section>
      <dialog id="revoke-dialog" aria-labelledby="revoke-title">
        <h2 id="revoke-title">撤销本设备授权？</h2>
        <p>撤销后，本设备的通知和访问权限会立即失效。</p>
        <p>如需恢复，必须在 Mac 上生成新的配对码并重新配对。</p>
        <button id="revoke-cancel" autofocus>取消</button>
        <button id="revoke-confirm" class="error">确认撤销</button>
      </dialog>
    </main>
  </body>
</html>
